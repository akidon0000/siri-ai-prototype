name: Check siri-ai skill

on:
  pull_request:
    paths:
      - "ios/Library/Sources/AppFeature/AppFeature.docc/Tutorials/**"
      - "tools/tutorial-code/**"
      - "tools/skill/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - ".github/workflows/skill-check.yml"
  push:
    branches: [main]
    paths:
      - "ios/Library/Sources/AppFeature/AppFeature.docc/Tutorials/**"
      - "tools/tutorial-code/**"
      - "tools/skill/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - ".github/workflows/skill-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skill references match the tutorial
        run: python3 tools/skill/generate.py --check

      - name: Manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool plugins/siri-ai/.claude-plugin/plugin.json > /dev/null
